name: Windows WebGL

# Chrome on Windows runs WebGL2 on ANGLE's Direct3D 11 backend, which compiles the GLSL to HLSL with
# the FXC compiler. That compiler has rejected shaders that every other backend accepts, and then the
# context is lost. This job runs the render cases there, on WARP (Microsoft's software Direct3D 11,
# same compiler). Chrome's own log, printed on failure, has the compiler error.

on:
  pull_request:
    paths:
      - 'packages/pixi-silk/src/**'
      - 'scripts/check-render.mjs'
      - 'scripts/render-cases.js'
      - '.github/workflows/windows-webgl.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-webgl-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pixi-silk build

      - name: Render cases on Direct3D 11 (WARP)
        shell: pwsh
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
          CHROME_ARGS: --use-gl=angle --use-angle=d3d11-warp --ignore-gpu-blocklist --enable-gpu --enable-logging=stderr --v=0 --enable-gpu-service-logging
          DEBUG: pw:browser
        run: node scripts/check-render.mjs --renderer=webgl 2>&1 | Tee-Object -FilePath render.log; exit $LASTEXITCODE

      - name: Compiler errors from Chrome's log
        if: failure()
        shell: pwsh
        run: Select-String -Path render.log -Pattern 'error X|warning X|HLSL|D3DCompile|Failed to compile|compiler' | Select-Object -First 80

      - name: Translated HLSL, compiled with FXC
        # what ANGLE handed to Direct3D, compiled on its own so FXC prints the reason and the time
        if: always()
        shell: pwsh
        env:
          CHROME_PATH: C:\Program Files\Google\Chrome\Application\chrome.exe
          CHROME_ARGS: --use-gl=angle --use-angle=d3d11-warp --ignore-gpu-blocklist --enable-gpu
        run: |
          node scripts/dump-hlsl.mjs --out=hlsl
          $fxc = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter fxc.exe | Where-Object FullName -like '*x64*' | Select-Object -First 1
          Write-Output "fxc: $($fxc.FullName)"
          foreach ($flags in @(@(), @('/D', 'ANGLE_ENABLE_LOOP_FLATTEN'))) {
            Write-Output "== fxc $flags"
            $t = Measure-Command { & $fxc.FullName /nologo /T ps_5_0 /E main /O1 @flags /Fo hlsl/fragment.cso hlsl/fragment-fxc.hlsl 2>&1 | Select-Object -First 40 | Out-Host }
            Write-Output "fxc took $([math]::Round($t.TotalSeconds, 1)) s"
          }
          exit 0

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hlsl
          path: hlsl/
