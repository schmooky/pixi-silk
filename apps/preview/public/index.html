<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pixi-silk i18n preview</title>
<link rel="stylesheet" href="/preview.css">
<script type="importmap">
{ "imports": { "pixi.js": "/lib/pixi/pixi.mjs" } }
</script>
</head>
<body>
<header>
  <strong>pixi-silk i18n preview</strong>
  <label>Locale <select id="locale"></select></label>
  <label>Width <input id="width" type="range" min="160" max="640" value="420"></label>
  <span id="status"></span>
</header>
<main>
  <section id="stage"></section>
  <aside>
    <h2>Lint <span id="count"></span></h2>
    <table id="lint"><thead><tr><th>Cell</th><th>Locale</th><th>Key</th><th>Problem</th></tr></thead><tbody></tbody></table>
    <h2>Theme</h2>
    <p class="hint">Colours, outlines, glows and shadows change live. Weight, size and family need a new compile.</p>
    <div id="theme"></div>
    <button id="save" type="button">Save theme.json</button>
  </aside>
</main>
<script type="module" src="/preview.js"></script>
</body>
</html>
